# RefiX Configuration File
# This file contains default configuration values for the application

[DEFAULT]
# Application version
version = 2.0.0

[Logging]
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO
# Log file path (relative to script directory or absolute path)
file = refix.log
# Maximum log file size in MB (0 = unlimited)
max_size = 10
# Number of backup log files to keep
backup_count = 3

[API]
# Maximum number of retry attempts for API calls
max_retries = 3
# Delay between retries in seconds
retry_delay = 2
# Request timeout in seconds
timeout = 30
# Maximum input text length (in characters)
max_input_length = 100000

[Hotkeys]
# Customize hotkeys (use + for combinations, e.g., alt+p)
professionalize = alt+p
grammar = alt+g
format_code = alt+f
lengthen = alt+l
help = alt+h
exit = alt+esc

[GUI]
# GUI theme: dark, light, system
theme = dark
# Color theme: blue, green, dark-blue
color_theme = blue
# Window geometry (width x height)
setup_geometry = 500x400
help_geometry = 750x550

[Startup]
# Auto-add to Windows startup (true/false)
enable = false
